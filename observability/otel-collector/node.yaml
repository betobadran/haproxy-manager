# OTel Collector que roda EM CADA nó HAProxy (edge).
# Coleta: exporter Prometheus nativo do HAProxy, métricas do hapm-agent, métricas do host e os LOGS DE ACESSO do
# HAProxy (syslog RFC 5424 em 127.0.0.1:5514, habilitados em Configurações do cluster › Logs de acesso),
# carimba hapm.cluster / hapm.node e envia via OTLP para o collector gateway.
# Variáveis: HAPM_CLUSTER, HAPM_NODE, OTEL_GATEWAY_ENDPOINT (ex.: otel-gw.interno:4317), HAPM_LOG_LISTEN (padrão 127.0.0.1:5514)
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: haproxy
          scrape_interval: 15s
          static_configs:
            - targets: ["127.0.0.1:${env:HAPM_STATS_PORT:-8405}"]
        - job_name: hapm-agent
          scrape_interval: 15s
          static_configs:
            - targets: ["127.0.0.1:${env:HAPM_METRICS_PORT:-9101}"]
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization: { enabled: true }
      memory:
        metrics:
          system.memory.utilization: { enabled: true }
      load: {}
      network: {}
      filesystem: {}

  # logs de acesso do HAProxy (uma linha logfmt por requisição/conexão)
  syslog/haproxy:
    udp:
      listen_address: "${env:HAPM_LOG_LISTEN:-127.0.0.1:5514}"
    protocol: rfc5424
    operators:
      # o corpo vira só a mensagem (client=... fe=... status=...); cabeçalho syslog fica nos atributos
      - type: move
        from: attributes.message
        to: body

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  resource:
    attributes:
      - { key: hapm.cluster, value: "${env:HAPM_CLUSTER}", action: upsert }
      - { key: hapm.node, value: "${env:HAPM_NODE}", action: upsert }
  resource/logs:
    attributes:
      - { key: service.name, value: hapm-haproxy, action: upsert }
  batch:
    timeout: 10s
  batch/logs:
    timeout: 2s

exporters:
  otlp:
    endpoint: "${env:OTEL_GATEWAY_ENDPOINT}"
    tls:
      # em produção use TLS (ca_file / cert_file / key_file) entre edge e gateway
      insecure: ${env:OTEL_GATEWAY_INSECURE:-true}
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true

service:
  telemetry:
    metrics:
      level: basic
  pipelines:
    metrics:
      receivers: [prometheus, hostmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp]
    logs:
      receivers: [syslog/haproxy]
      processors: [memory_limiter, resource, resource/logs, batch/logs]
      exporters: [otlp]
