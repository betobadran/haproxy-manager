# Prometheus recebe as métricas por remote write do OTel Collector gateway
# (iniciar com --web.enable-remote-write-receiver). Não há scrape direto.
global:
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
