server:
  port: ${HAPM_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

spring:
  application:
    name: hapm-manager
  # Padrão: H2 em arquivo (um único manager). Para HA do próprio manager use PostgreSQL:
  #   SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/hapm  (+ USERNAME/PASSWORD)
  datasource:
    url: ${HAPM_DB_URL:jdbc:h2:file:${HAPM_DATA_DIR:./data}/hapm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${HAPM_DB_USER:sa}
    password: ${HAPM_DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 2MB

hapm:
  admin-user: ${HAPM_ADMIN_USER:admin}
  admin-password: ${HAPM_ADMIN_PASSWORD:}
  secret: ${HAPM_SECRET:}
  acme-directory: ${HAPM_ACME_DIRECTORY:acme://letsencrypt.org}
  haproxy-bin: ${HAPM_HAPROXY_BIN:haproxy}
  node-offline-after-sec: ${HAPM_NODE_OFFLINE_AFTER:15}
  deployment-timeout-sec: 600
  cert-renew-before-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
