server:
  port: ${HAPM_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

spring:
  application:
    name: hapm-manager
  # Padrão: H2 em arquivo (um único manager). Para HA do próprio manager use PostgreSQL:
  #   SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/hapm  (+ USERNAME/PASSWORD)
  datasource:
    url: ${HAPM_DB_URL:jdbc:h2:file:${HAPM_DATA_DIR:./data}/hapm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${HAPM_DB_USER:sa}
    password: ${HAPM_DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 2MB

hapm:
  admin-user: ${HAPM_ADMIN_USER:admin}
  admin-password: ${HAPM_ADMIN_PASSWORD:}
  secret: ${HAPM_SECRET:}
  acme-directory: ${HAPM_ACME_DIRECTORY:acme://letsencrypt.org}
  haproxy-bin: ${HAPM_HAPROXY_BIN:haproxy}
  node-offline-after-sec: ${HAPM_NODE_OFFLINE_AFTER:15}
  deployment-timeout-sec: 600
  cert-renew-before-days: 30
  auth:
    session-hours: 12
    # usuários locais (inclui o admin inicial). Em produção, mantenha só um admin local "break-glass".
    local:
      enabled: ${HAPM_AUTH_LOCAL_ENABLED:true}
    # papéis: VIEWER (leitura) < OPERATOR (edita e solicita publicação) | APPROVER (aprova) < ADMIN (tudo)
    # mapeie grupos do LDAP/IdP para papéis (nomes de grupo sem diferenciar maiúsculas; DN completo ou só o CN)
    role-mapping:
      ADMIN: ${HAPM_ROLES_ADMIN:hapm-admins}
      APPROVER: ${HAPM_ROLES_APPROVER:hapm-approvers}
      OPERATOR: ${HAPM_ROLES_OPERATOR:hapm-operators}
      VIEWER: ${HAPM_ROLES_VIEWER:hapm-viewers}
    default-roles: ${HAPM_DEFAULT_ROLES:}
    ldap:
      enabled: ${HAPM_LDAP_ENABLED:false}
      url: ${HAPM_LDAP_URL:ldaps://ldap.exemplo.com:636}
      base-dn: ${HAPM_LDAP_BASE_DN:dc=exemplo,dc=com}
      user-dn-pattern: ${HAPM_LDAP_USER_DN_PATTERN:}
      user-search-base: ${HAPM_LDAP_USER_SEARCH_BASE:ou=people}
      user-search-filter: ${HAPM_LDAP_USER_SEARCH_FILTER:(uid={0})}
      manager-dn: ${HAPM_LDAP_MANAGER_DN:}
      manager-password: ${HAPM_LDAP_MANAGER_PASSWORD:}
      group-search-base: ${HAPM_LDAP_GROUP_SEARCH_BASE:ou=groups}
      group-search-filter: ${HAPM_LDAP_GROUP_SEARCH_FILTER:(member={0})}
      group-role-attribute: ${HAPM_LDAP_GROUP_ATTRIBUTE:cn}
      display-name-attribute: ${HAPM_LDAP_DISPLAY_NAME_ATTRIBUTE:cn}
      # Active Directory: preencha o domínio (ex.: corp.exemplo.com) e a URL (ldaps://dc.corp.exemplo.com)
      active-directory-domain: ${HAPM_LDAP_AD_DOMAIN:}
    oidc:
      enabled: ${HAPM_OIDC_ENABLED:false}
      registration-id: hapm
      label: ${HAPM_OIDC_LABEL:Entrar com SSO}
      username-claim: ${HAPM_OIDC_USERNAME_CLAIM:preferred_username}
      groups-claim: ${HAPM_OIDC_GROUPS_CLAIM:groups}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
