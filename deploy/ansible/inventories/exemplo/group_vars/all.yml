# --- artefatos gerados pelo Maven (mvn -DskipTests package na raiz do repositório)
hapm_repo_root: "{{ playbook_dir }}/../.."
hapm_agent_jar: "{{ hapm_repo_root }}/hapm-agent/target/hapm-agent.jar"
hapm_manager_jar: "{{ hapm_repo_root }}/hapm-manager/target/hapm-manager.jar"

# --- manager
hapm_manager_url: "http://10.10.0.5:8080"
hapm_manager_port: 8080
# senha inicial do admin: guarde no ansible-vault (ansible-vault encrypt_string)
hapm_admin_password: "{{ vault_hapm_admin_password | default('troque-me-agora') }}"
# PostgreSQL opcional para o manager (vazio = H2 local)
hapm_db_url: ""
hapm_db_user: ""
hapm_db_password: ""

# --- agentes: token copiado da tela do cluster (Visão geral > Adicionar nós). Use ansible-vault.
hapm_join_token: "{{ vault_hapm_join_token | default('') }}"
hapm_node_interface: eth0
hapm_cluster_name: dc1

# --- observabilidade: gateway OTel central (OTLP gRPC)
otel_gateway_endpoint: "10.10.0.5:4317"
otelcol_version: "0.114.0"
otelcol_download_url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otelcol_version }}/otelcol-contrib_{{ otelcol_version }}_linux_amd64.deb"
