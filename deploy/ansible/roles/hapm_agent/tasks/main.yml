- name: Diretórios do agente
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop: [/opt/hapm-agent, /etc/hapm, /var/lib/hapm]

- name: Jar do agente
  ansible.builtin.copy:
    src: "{{ hapm_agent_jar }}"
    dest: /opt/hapm-agent/hapm-agent.jar
    mode: "0644"
  notify: Reiniciar hapm-agent

- name: Configuração do agente (contém o token de join)
  ansible.builtin.template:
    src: agent.env.j2
    dest: /etc/hapm/agent.env
    mode: "0600"
  notify: Reiniciar hapm-agent

- name: Unit systemd do agente
  ansible.builtin.copy:
    src: "{{ hapm_repo_root }}/hapm-agent/src/main/dist/systemd/hapm-agent.service"
    dest: /etc/systemd/system/hapm-agent.service
    mode: "0644"
  notify: Reiniciar hapm-agent

- name: Release bootstrap (config mínima até a 1ª publicação)
  ansible.builtin.command: java -jar /opt/hapm-agent/hapm-agent.jar --bootstrap
  environment:
    HAPM_HAPROXY_DIR: /etc/haproxy/hapm
  args:
    creates: /etc/haproxy/hapm/current

- name: HAProxy rodando
  ansible.builtin.systemd:
    name: haproxy
    state: started
    daemon_reload: true

- name: Agente habilitado e rodando
  ansible.builtin.systemd:
    name: hapm-agent
    enabled: true
    state: started
    daemon_reload: true
  when: hapm_join_token | length > 0

- name: Aviso de token ausente
  ansible.builtin.debug:
    msg: "hapm_join_token vazio: crie o cluster no manager, copie o token e rode de novo com --limit haproxy_nodes"
  when: hapm_join_token | length == 0
