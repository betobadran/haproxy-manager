- name: Pacotes base (Java 21 para agente/manager)
  ansible.builtin.apt:
    name: [openjdk-21-jre-headless, curl, ca-certificates]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Pacotes base (RHEL/Rocky/Alma)
  ansible.builtin.dnf:
    name: [java-21-openjdk-headless, curl, ca-certificates]
    state: present
  when: ansible_os_family == "RedHat"
