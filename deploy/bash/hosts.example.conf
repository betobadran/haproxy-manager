# Inventário do deploy.sh (arquivo bash). Copie para hosts.conf e ajuste.
# Segredos ficam em arquivos fora do git (chmod 600); o deploy.sh os envia pelo stdin do ssh.

SSH_USER=ubuntu                        # usuário com sudo sem senha nos servidores
SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)

# --- manager
MANAGER_HOST=10.10.0.5
MANAGER_ARGS=(--port 8080 --with-postgres)   # sem --with-postgres: SQLite; banco externo: --db-url ... --db-user hapm
ADMIN_PASSWORD_FILE=./secrets/admin-password
MANAGER_ENV_FILE=                      # opcional: LDAP/OIDC (docs/autenticacao.md)

# --- nós HAProxy ("nome ip" — o ip é usado para o ssh e para o VRRP)
NODES=(
  "lb01 10.10.0.11"
  "lb02 10.10.0.12"
)
MANAGER_URL=http://10.10.0.5:8080
JOIN_TOKEN_FILE=./secrets/join-token   # UI > cluster > Visão geral > Adicionar nós
NODE_ARGS=(--interface eth0 --cluster-label dc1 --otel-gateway 10.10.0.5:4317)
